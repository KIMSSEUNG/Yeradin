version: '3.8'

name: yeradin

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    
  backend:
    build:
      context: ./daejeon_5_13_finalproject_yeoladin_BE
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ}&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY: ${JWT_ACCESS_TOKEN_VALIDITY}
      JWT_REFRESH_TOKEN_VALIDITY: ${JWT_REFRESH_TOKEN_VALIDITY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CLIENT_SCOPE: ${GOOGLE_CLIENT_SCOPE}
      UPLOAD_IMAGE_DIR: ${UPLOAD_IMAGE_DIR}
      UPLOAD_VIDEO_DIR: ${UPLOAD_VIDEO_DIR}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks: [backend]
    volumes:
      - images:/app/data/images
      - videos:/app/data/videos/yeoladin

  nginx:
    build:
      context: ./daejeon_5_13_finalproject_yeoladin_FE
      dockerfile: Dockerfile
      args:
        VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY}
        VITE_KAKAO_JS_API_KEY: ${VITE_KAKAO_JS_API_KEY}
        VITE_APP_DEVELOP_FRONT_URL: ${VITE_APP_DEVELOP_FRONT_URL}
        VITE_APP_DEVELOP_BACKEND_URL: ${VITE_APP_DEVELOP_BACKEND_URL}
    container_name: nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"      # HTTP만 사용
    networks: [backend]

networks:
  backend: {}

volumes:
  mysql_data:
  images:
  videos:
