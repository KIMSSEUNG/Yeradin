spring.config.import=optional:classpath:env.properties

spring.application.name=finalPRJ_yeoladin

# ===============================
# DB
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# ?? ???
#  - .env? ? ??? ??, ??? ?? ??? ??(fallback)
# ===============================
spring.servlet.multipart.location=${UPLOAD_IMAGE_DIR:${user.home}/images}
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${UPLOAD_VIDEO_DIR:${user.home}/videos/yeoladin}

# ===============================
# ??? ?(Hikari)
# ===============================
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=600000
spring.datasource.hikari.data-source-properties.profileSQL=true

# ===============================
# MyBatis
# ===============================
mybatis.type-aliases-package=com.ssafy.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mappers/**/*.xml

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY}
jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY}

# ===============================
# Spring AI (OpenAI)
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE}
spring.ai.openai.chat.options.maxCompletionTokens=${OPENAI_MAX_COMPLETION_TOKENS}

# ===============================
# OAuth2 (Google)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_CLIENT_SCOPE}
